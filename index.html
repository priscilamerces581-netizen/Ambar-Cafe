
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Âmbar Café</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #F7F3EC;
            font-family: 'DM Sans', sans-serif;
            color: #493B2D;
            margin: 0;
        }

        .navbar {
            background-color: #F7F3EC;
            border-bottom: 1px solid #DED5C8;
            padding: 1.4rem 0;
        }

        .navbar .container {
            max-width: 1600px;
            width: 100%;
            padding-left: 3.5rem;
            padding-right: 3.5rem;
        }

        .navbar-brand {
            color: #493B2D !important;
            font-family: 'Bodoni Moda', serif;
            font-size: 2.8rem;
            letter-spacing: 0.04rem;
        }

        .navbar-nav {
            gap: 2.2rem;
        }

        .nav-link {
            color: #665747 !important;
            font-size: 1.25rem;
            font-weight: 500;
            margin-left: 0;
            padding: 0.5rem 0 !important;
            transition: 0.3s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: #A18468 !important;
        }

        .navbar-toggler {
            border-color: #B9A58F;
        }

        .navbar-toggler:focus {
            box-shadow: none;
        }

        .apresentacao {
            background-color: #F7F3EC;
            min-height: 82vh;
            display: flex;
            align-items: center;
            padding: 3.5rem 0;
        }

        .apresentacao .container {
            max-width: 1600px;
            width: 100%;
            padding-left: 3.5rem;
            padding-right: 3.5rem;
        }

        .apresentacao .row {
            --bs-gutter-x: 4rem;
        }

        .subtitulo {
            color: #A18468;
            font-size: 0.8rem;
            letter-spacing: 0.22rem;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .titulo-principal {
            font-family: 'Bodoni Moda', serif;
            font-size: clamp(3rem, 5vw, 4.5rem);
            font-weight: 400;
            line-height: 1.18;
            color: #493B2D;
        }

        .texto-principal {
            color: #887968;
            font-size: 1.1rem;
            line-height: 1.9;
            margin-top: 1.5rem;
            max-width: 35rem;
        }

        .botao-cardapio {
            display: inline-block;
            background-color: #493B2D;
            color: white;
            text-decoration: none;
            padding: 1.15rem 2.2rem;
            font-size: 1rem;
            letter-spacing: 0.05rem;
            margin-top: 1.5rem;
            transition: 0.3s;
        }

        .botao-cardapio:hover {
            background-color: #A18468;
            color: white;
        }

        .imagem-cafe {
            width: 100%;
            height: clamp(28rem, 38vw, 36rem);
            object-fit: cover;
            display: block;
        }

        @media (max-width: 48rem) {
            .navbar {
                padding: 0.9rem 0;
            }

            .navbar .container {
                padding-left: 1.25rem;
                padding-right: 1.25rem;
            }

            .navbar-brand {
                font-size: 2.1rem;
            }

            .navbar-nav {
                gap: 0.4rem;
                padding-top: 1rem;
            }

            .nav-link {
                font-size: 1.1rem;
                padding: 0.6rem 0 !important;
            }

            .apresentacao {
                min-height: auto;
                padding: 3rem 0;
            }

            .apresentacao .container {
                padding-left: 1.5rem;
                padding-right: 1.5rem;
            }

            .apresentacao .row {
                --bs-gutter-x: 1.5rem;
            }

            .titulo-principal {
                font-size: clamp(2.4rem, 8vw, 3.2rem);
            }

            .texto-principal {
                font-size: 1rem;
            }

            .imagem-cafe {
                height: clamp(19rem, 75vw, 25rem);
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand" href="{% url 'inicio' %}">
                Âmbar Café
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false"
                aria-label="Abrir menu">

                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    fill="#493B2D" viewBox="0 0 16 16">
                    <path d="M1 3.5h14v1H1zm0 4h14v1H1zm0 4h14v1H1z"/>
                </svg>

            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'inicio' %}">Início</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'cardapio' %}">Cardápio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'sobre_nos' %}">Quem somos</a>
                    </li>


                </ul>
            </div>

        </div>
    </nav>

    <section id="inicio" class="apresentacao">

        <div class="container">

            <div class="row align-items-center">

                <div class="col-md-5">

                    <p class="subtitulo">
                        SEU MOMENTO DE PAUSA COMEÇA AQUI
                    </p>

                    <h1 class="titulo-principal">
                        Seu novo lugar favorito tem cheiro de café.
                    </h1>

                    <p class="texto-principal">
                        Cada xícara é preparada para tornar seu dia melhor.
                        Um espaço para desacelerar, apreciar bons sabores
                        e aproveitar os pequenos momentos.
                    </p>

                    <a href="{% url 'cardapio' %}" class="botao-cardapio">
                        CONHEÇA NOSSO CARDÁPIO →
                    </a>

                </div>

                <div class="col-md-7 mt-5 mt-md-0">

                    <img
                        src="https://i.pinimg.com/736x/d1/3b/43/d13b43dc0d27aa272b3a4807cebce52e.jpg"
                        class="imagem-cafe"
                        alt="Cappuccino e café">

                </div>

            </div>

        </div>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
